name: CV Apply 24/7 Engine Workflow

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 3 hours 24/7 without stopping
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-cvapply-daemon-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run Auto-Sourcing, Scoring & Application Cycle
        env:
          CONVEX_DEPLOY_URL: ${{ secrets.CONVEX_DEPLOY_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCORING_MODEL: ${{ vars.SCORING_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          COVER_LETTER_MODEL: ${{ vars.COVER_LETTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          OPENROUTER_FALLBACK_MODEL: ${{ vars.OPENROUTER_FALLBACK_MODEL || 'xingchen-agi/xing4.0-29b-a4b:free' }}
          # NVIDIA models reached end-of-life 2026-08-26 and this account has no
          # model access; leaving the key set costs 90s of dead retries per job.
          NVIDIA_API_KEY: ""
          EMAIL_APPLY_ENABLED: "1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          CV_PDF_PATH: "./Sanjeev_CV.pdf"
          CV_FILE_PATH: "./Sanjeev_CV.pdf"
          DAILY_APP_CAP: "1000"
          ONLY_SRI_LANKA: "1"
        run: |
          python -m cvapply.daemon --submit --interval 0 --batch-limit 100
